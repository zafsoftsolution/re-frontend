# ── Rakib Enterprise — frontend CI/CD ───────────────────────────────────────
# ci         : type-check + lint + unit tests (+ next build on PRs only)
# build-push : build Docker image, push to GHCR (push to main / manual run)
# deploy     : SSH to the VPS, pull the new image, restart, health-check
#
# See DEPLOYMENT.md for the required secrets / variables and server setup.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22" # keep in sync with ARG NODE_VERSION in Dockerfile
  IMAGE_NAME: ghcr.io/zafsoftsolution/re-frontend
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    env:
      # Public, build-time values (GitHub → Settings → Variables → Actions).
      NEXT_PUBLIC_DJANGO_API_URL: ${{ vars.NEXT_PUBLIC_DJANGO_API_URL || 'https://api.rakibenterprise-bd.com/api/auth' }}
      NEXT_PUBLIC_DJANGO_BACKEND: ${{ vars.NEXT_PUBLIC_DJANGO_BACKEND || 'https://api.rakibenterprise-bd.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next-env.d.ts and route types are gitignored; `typecheck` runs
      # `next typegen` first.
      - name: Type-check
        run: npm run typecheck

      # Public site + shared code must lint clean (blocking).
      - name: Lint (public site)
        run: npm run lint:site

      # Whole project, admin console included (blocking).
      - name: Lint (all, incl. admin)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # On pushes to main / manual runs the build-push job builds the same
      # app inside Docker, so only PRs build here (no double build). Catalogue
      # detail pages prerender just a placeholder param unless
      # PRERENDER_CATALOG=1, so the build makes no per-entity API calls.
      - name: Build
        if: github.event_name == 'pull_request'
        run: npm run build

  build-push:
    name: Build & push image
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            NEXT_PUBLIC_DJANGO_API_URL=${{ vars.NEXT_PUBLIC_DJANGO_API_URL || 'https://api.rakibenterprise-bd.com/api/auth' }}
            NEXT_PUBLIC_DJANGO_BACKEND=${{ vars.NEXT_PUBLIC_DJANGO_BACKEND || 'https://api.rakibenterprise-bd.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-frontend
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep the server's compose file in sync with the repo.
      - name: Upload docker-compose.prod.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: RE/re_frontend # relative to the SSH user's home

      - name: Pull & restart over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: sha-${{ needs.build-push.outputs.short_sha }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_PAT,GHCR_USER
          script: |
            set -euo pipefail
            cd ~/RE/re_frontend

            # Optional: only needed if the GHCR package is private.
            if [ -n "${GHCR_PAT:-}" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            export IMAGE_TAG
            echo "Deploying ghcr.io/zafsoftsolution/re-frontend:${IMAGE_TAG}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            # Health check on the loopback-published port.
            healthy=0
            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null http://127.0.0.1:9085/; then
                echo "Health check passed (attempt $i)"
                healthy=1
                break
              fi
              echo "Waiting for frontend... ($i/20)"
              sleep 5
            done
            if [ "$healthy" != 1 ]; then
              echo "Health check FAILED" >&2
              docker compose -f docker-compose.prod.yml logs --tail=100 frontend || true
              exit 1
            fi

            # Purge the data cache so the new build never serves entries
            # cached by the previous one (keep in sync with src/lib/api/tags.ts).
            secret="$(grep -E '^REVALIDATE_SECRET=' .env.local 2>/dev/null | tail -n1 | cut -d= -f2- | tr -d '\r"' || true)"
            if [ -z "$secret" ]; then
              echo "::warning::REVALIDATE_SECRET missing from ~/RE/re_frontend/.env.local; skipping post-deploy revalidation"
            else
              if curl -fsS -o /dev/null -X POST http://127.0.0.1:9085/api/revalidate \
                  -H "x-revalidate-secret: $secret" -H 'content-type: application/json' \
                  -d '{"tags":["bootstrap","settings","categories","machine-brands","machine-models","machines","brands","products","sitemap","redirects"]}'; then
                echo "Post-deploy revalidation done"
              else
                echo "::warning::post-deploy revalidation failed (site is up; caches heal on their own cacheLife)"
              fi
            fi

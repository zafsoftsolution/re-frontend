# ── Rakib Enterprise — frontend CI/CD ───────────────────────────────────────
# ci         : lint + type-check + build (push & PR to main)
# build-push : build Docker image, push to GHCR (push to main / manual run)
# deploy     : SSH to the VPS, pull the new image, restart, health-check
#
# See DEPLOYMENT.md for the required secrets / variables and server setup.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22" # keep in sync with ARG NODE_VERSION in Dockerfile
  IMAGE_NAME: ghcr.io/zafsoftsolution/re-frontend
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    env:
      # Public, build-time values (GitHub → Settings → Variables → Actions).
      NEXT_PUBLIC_DJANGO_API_URL: ${{ vars.NEXT_PUBLIC_DJANGO_API_URL }}
      NEXT_PUBLIC_DJANGO_BACKEND: ${{ vars.NEXT_PUBLIC_DJANGO_BACKEND }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The codebase currently has pre-existing ESLint errors; report them
      # without blocking the pipeline. Remove continue-on-error once fixed.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # next-env.d.ts and route types are gitignored; generate them first.
      - name: Type-check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build
        run: npm run build

  build-push:
    name: Build & push image
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            NEXT_PUBLIC_DJANGO_API_URL=${{ vars.NEXT_PUBLIC_DJANGO_API_URL }}
            NEXT_PUBLIC_DJANGO_BACKEND=${{ vars.NEXT_PUBLIC_DJANGO_BACKEND }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-frontend
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep the server's compose file in sync with the repo.
      - name: Upload docker-compose.prod.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: RE/re_frontend # relative to the SSH user's home

      - name: Pull & restart over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: sha-${{ needs.build-push.outputs.short_sha }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_PAT,GHCR_USER
          script: |
            set -euo pipefail
            cd ~/RE/re_frontend

            # Optional: only needed if the GHCR package is private.
            if [ -n "${GHCR_PAT:-}" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            export IMAGE_TAG
            echo "Deploying ghcr.io/zafsoftsolution/re-frontend:${IMAGE_TAG}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            # Health check on the published host port (NPM proxies to it).
            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null http://127.0.0.1:9085/; then
                echo "Health check passed (attempt $i)"
                exit 0
              fi
              echo "Waiting for frontend... ($i/20)"
              sleep 5
            done
            echo "Health check FAILED" >&2
            docker compose -f docker-compose.prod.yml logs --tail=100 frontend || true
            exit 1
